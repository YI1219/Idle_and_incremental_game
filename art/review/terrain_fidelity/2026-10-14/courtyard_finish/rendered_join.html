<!doctype html><meta charset="utf-8"><title>岩脚连接研究</title><style>body{margin:24px;background:#e9e7df;color:#303933;font:16px system-ui}p{max-width:1080px;line-height:1.7}select{font:inherit;padding:8px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}img{width:100%}figure{margin:0}section{margin-top:24px}</style><h1>岩脚与岛底 · 局部形体研究，尚未采用</h1><p>默认仍为 spall_finish1。三向重建和整体填缝未解决分层；按原有岩块朝向连接实际下方岩体，并修正退让高度后，左侧岩面更连续。仍有过宽墙面、硬草沿和右侧悬垂体量，不能代表完成效果。整岩体交界切割产生内部空腔，舍弃；沿真实外表面接续一条已有凹缝，只获得局部改善。</p><label>左侧<select id="base"><option value="rendered_legacy_control1">原场景</option><option value="join_rawcap1">重建基线</option><option value="crown_roots1">岩脚 v1 · 横槽错误</option><option value="crown_roots2">岩脚 v2 · 局部方向</option></select></label> <label>右侧<select id="stage"><option value="join_raw1">重建初稿 · 顶面偏低</option><option value="join_closed1">小范围填合</option><option value="join_rawcap1">纠正顶面</option><option value="join_closedcap1">大范围填合</option><option value="crown_roots1">岩脚 v1 · 横槽错误</option><option value="crown_roots2" selected>岩脚 v2 · 修正连接</option><option value="crown_roots3">内部交界切割 · 舍弃</option><option value="exposed_cleft1">真实外表面凹缝 · 局部方向</option></select></label><main id="views"></main><p>24张本轮局部实机图，近景、接缝、反向；原场景3张为已有同视角对照。数据重建会改变部分装饰，法线与草沿均为工具实验。v2仍有一块96三角面脱离片；v3另产生6个朝内的封闭空腔面；外表面开槽版仍为原来的两个外向组件。功能、美术、性能分开接受。</p><script>function draw(){views.innerHTML=['close','grass','reverse'].map(v=>`<section><h2>${v}</h2><div class="pair"><figure><img src="${base.value}_${v}.png"></figure><figure><img src="${stage.value}_${v}.png"></figure></div></section>`).join('')}base.onchange=stage.onchange=draw;draw()</script>
