<!doctype html><meta charset="utf-8"><title>三维崖壁组合与表面诊断</title><style>body{margin:24px;background:#e9e7df;color:#303933;font:16px system-ui}p{max-width:1000px;line-height:1.7}select{font:inherit;padding:8px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}img{width:100%}figure{margin:0}section{margin-top:24px}</style><h1>三维崖壁组合 · 尚未采用</h1><p>默认画面仍为 spall_finish1。天然崖壁源经封背成为完整体积，再接入同一可编辑地形。直立版外翻、悬挂，转向版减少外翻却留下厚重斜层和突出端块。法线对照消除了大部分规则阶梯明暗，但形体与草石接缝仍不达标；还有一块24三角面的脱离片。全部不推广。</p><label>左侧<select id="base"><option value="rendered_legacy_control1">原场景</option><option value="cliff_group2">转向版 · 原法线</option></select></label> <label>右侧<select id="stage"><option value="cliff_group1">直立版</option><option value="cliff_group2">转向版</option><option value="cliff_group2_gradient" selected>转向版 · 连续法线诊断</option></select></label><main id="views"></main><p>9张正式局部实机图；另3张旧法线对照因重建道具被排除。校正后只替换岩体网格法线，上传顶点、颜色、UV以及场景变换和实例缓冲均保持一致。云雾实时，四项水钟固定。30张天然源灰模另存为来源检查，不代表成品接受。</p><script>function draw(){views.innerHTML=['close','grass','reverse'].map(v=>`<section><h2>${v}</h2><div class="pair"><figure><img src="${base.value}_${v}.png"></figure><figure><img src="${stage.value}_${v}.png"></figure></div></section>`).join('')}base.onchange=stage.onchange=draw;draw()</script>
