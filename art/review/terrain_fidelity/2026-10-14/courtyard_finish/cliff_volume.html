<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云露村 · 接缝与岩体试验</title><style>body{margin:0;background:#eeece3;color:#35443e;font:16px/1.65 system-ui}main{max-width:1800px;margin:auto;padding:26px}h1{font-size:29px;font-weight:500}p{max-width:1100px}a{color:#496c59}select{font:inherit;padding:7px;margin:5px 15px 15px 3px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0}img{display:block;width:100%}figcaption{padding:8px;background:#faf7ed}@media(max-width:900px){.pair{grid-template-columns:1fr}}</style><main><a href="comparison.html">返回默认实景</a><h1>草石接缝与实际体积 · 全部未采用</h1><p>草丛加宽让部分裂隙更可读，但反面出现叶片排边。稳定采样通过有限功能检查，却让反面裸露更多。现有崖石烘入可编辑体积后，仍像宽墙接圆腹；加入开口岩隙、清除孤片，也没有达到目标的自然折面与连贯收底。默认场景不变。</p><label>机位<select id="view"></select></label><label>试验<select id="variant"></select></label><label>左图<select id="base"><option value="auto">相应模式基准</option><option value="connection_control1">正式默认基准</option><option value="sourcevolume_control1">统一体积基准</option></select></label><div class="pair"><figure><figcaption id="beforecaption"></figcaption><img id="before" alt="实际引擎基准"></figure><figure><figcaption id="aftercaption"></figcaption><img id="after" alt="拒绝采用的实际引擎试验"></figure></div><p>各七个匹配机位，四组水时钟固定1.25，云海和水雾仍运动。草丛五版保留默认作者数据；体积三版保留同一格子数据，加入普通存档密度样本，统一模式与正式默认的全岛衍生几何不同。小样本功能或闭合通过不等于美术通过。目标图单独保留，不混作实机成果。</p></main><script>const views={"close": "岛缘近景", "overview": "全岛", "far": "远景", "grass": "草石接缝", "reverse": "反向", "shore": "池岸", "bottom": "底面"},tags={"grasspatch1": "低宽草丛 · 原采样", "grasssample1": "原叶片 · 全周长采样", "grasspatch2": "低宽草丛 · 全周长采样", "grasspatch3": "低宽草丛 · 转角偏置", "grasssample2": "原叶片 · 世界探针", "sourcevolume_control1": "统一体积 · 未塑形基准", "sourcevolume1": "现有源下收并集 v1", "sourcevolume2": "保留肩部并集 v2", "sourcevolume3": "开口岩隙与小组件清理 v3"};for(const[id,items]of [['view',views],['variant',tags]])for(const[key,label]of Object.entries(items)){const o=document.createElement('option');o.value=key;o.textContent=label;document.getElementById(id).append(o)}const v=document.getElementById('view'),t=document.getElementById('variant'),b=document.getElementById('base');t.value='sourcevolume3';function update(){let before=b.value==='auto'?(t.value.startsWith('sourcevolume')?'sourcevolume_control1':'connection_control1'):b.value;document.getElementById('before').src=before+'_'+v.value+'.png';document.getElementById('after').src=t.value+'_'+v.value+'.png';document.getElementById('beforecaption').textContent=before==='connection_control1'?'正式默认 · 前轮基准':'统一体积 · 本轮新拍基准';document.getElementById('aftercaption').textContent=tags[t.value]+' · 未采用'}v.onchange=t.onchange=b.onchange=update;update();</script></html>
