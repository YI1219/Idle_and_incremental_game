<!doctype html><meta charset="utf-8"><title>岛侧与原岩体试验</title>
<style>body{margin:24px;background:#eae8e0;color:#303a36;font:16px system-ui}select{font:inherit;padding:8px}section{margin:24px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}img{width:100%;display:block}figure{margin:0}p{max-width:1000px;line-height:1.7}</style>
<h1>岛侧与原岩体试验 · 均未推广</h1><p>左侧是当前原场景；右侧为未接受的局部试验。前期侧面试验使用另一种更圆的统一基底，不能当作原场景保形修改。原主体转换不含高出露岩，草木位置也有变化。最新填实修掉草顶方格，但灰肩、叠底与排草仍不达标。主效果仍为 spall_finish1。</p>
<select id="stage"><option value="rendered_legacy_control1">原场景主体基准</option><option value="face_replacement1">旧源前表面替换</option><option value="face_replacement2">旧源上段与连续下返</option><option value="face_scan1">扫描面原朝向</option><option value="face_scan2">扫描面刚性转向</option><option value="face_scan3">扫描面回接原统一底</option><option value="face_scan4">扫描面等比放大</option><option value="face_scan5">扫描面竖向与端部渐接</option><option value="face_scan6_bare">保留顶缘起伏 · 裸面</option><option value="face_scan6_cap">实际轮廓草盖 · 两扇</option><option value="face_scan6_leaf">实际轮廓草盖 · 原三扇</option><option value="rendered_body1">原主体 · 不可靠绕数转换</option><option value="rendered_envelope1">原主体 · 竖向填实</option><option value="rendered_envelopecap1">原主体 · 填实与均匀草顶距离</option></select><main id="views"></main>
<p>均为 Godot Metal 实机，固定相机及四项水体时钟；云雾实时。42张有效局部截图，另3张失败草盖记录排除。只有有限保存、支撑和拓扑检查；不代表完整编辑、美术或性能接受。</p>
<script>const labels={"rendered_legacy_control1": "原场景主体基准", "face_replacement1": "旧源前表面替换", "face_replacement2": "旧源上段与连续下返", "face_scan1": "扫描面原朝向", "face_scan2": "扫描面刚性转向", "face_scan3": "扫描面回接原统一底", "face_scan4": "扫描面等比放大", "face_scan5": "扫描面竖向与端部渐接", "face_scan6_bare": "保留顶缘起伏 · 裸面", "face_scan6_cap": "实际轮廓草盖 · 两扇", "face_scan6_leaf": "实际轮廓草盖 · 原三扇", "rendered_body1": "原主体 · 不可靠绕数转换", "rendered_envelope1": "原主体 · 竖向填实", "rendered_envelopecap1": "原主体 · 填实与均匀草顶距离"}, views={"close": "岛缘近景", "grass": "草石接缝", "reverse": "反向"};stage.value='rendered_envelopecap1';function draw(){document.querySelector('#views').innerHTML=Object.entries(views).map(([v,n])=>`<section><h2>${n}</h2><div class="pair"><figure><img src="rendered_legacy_control1_${v}.png"><figcaption>原场景</figcaption></figure><figure><img src="${stage.value}_${v}.png"><figcaption>${labels[stage.value]}</figcaption></figure></div></section>`).join('')}stage.onchange=draw;draw()</script>
