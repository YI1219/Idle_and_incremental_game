<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水体稍清澈 · Godot前后实拍</title><style>body{margin:0;background:#eeede5;color:#293d37;font-family:system-ui,sans-serif}main{max-width:1800px;margin:auto;padding:28px}h1{font-size:26px}h2{font-size:19px;margin-top:32px}p{line-height:1.7;max-width:900px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}figure{margin:0}figcaption{padding:8px 0}img{width:100%;display:block;border-radius:5px}a{color:inherit}@media(max-width:760px){.pair{grid-template-columns:1fr}main{padding:16px}}</style><main><h1>水体稍清澈</h1><p>降低水色吸收、倒影覆盖与折射扭曲，让浅水边缘稍通透。每组前后使用同一个场景、相机、光照和动态相位。点击图片查看原生2K图。</p><section><h2>日景池水近景</h2><div class="pair"><figure><figcaption>调整前</figcaption><a href="04_day_pair/close_before.png"><img src="04_day_pair/close_before.png" alt="日景池水近景调整前"></a></figure><figure><figcaption>稍清澈</figcaption><a href="04_day_pair/close_after.png"><img src="04_day_pair/close_after.png" alt="日景池水近景调整后"></a></figure></div></section><section><h2>日景全景</h2><div class="pair"><figure><figcaption>调整前</figcaption><a href="04_day_pair/whole_before.png"><img src="04_day_pair/whole_before.png" alt="日景全景调整前"></a></figure><figure><figcaption>稍清澈</figcaption><a href="04_day_pair/whole_after.png"><img src="04_day_pair/whole_after.png" alt="日景全景调整后"></a></figure></div></section><section><h2>日景反向</h2><div class="pair"><figure><figcaption>调整前</figcaption><a href="04_day_pair/reverse_before.png"><img src="04_day_pair/reverse_before.png" alt="日景反向调整前"></a></figure><figure><figcaption>稍清澈</figcaption><a href="04_day_pair/reverse_after.png"><img src="04_day_pair/reverse_after.png" alt="日景反向调整后"></a></figure></div></section><section><h2>夜景池水近景</h2><div class="pair"><figure><figcaption>调整前</figcaption><a href="05_night_pair/close_before.png"><img src="05_night_pair/close_before.png" alt="夜景池水近景调整前"></a></figure><figure><figcaption>稍清澈</figcaption><a href="05_night_pair/close_after.png"><img src="05_night_pair/close_after.png" alt="夜景池水近景调整后"></a></figure></div></section><section><h2>夜景全景</h2><div class="pair"><figure><figcaption>调整前</figcaption><a href="05_night_pair/whole_before.png"><img src="05_night_pair/whole_before.png" alt="夜景全景调整前"></a></figure><figure><figcaption>稍清澈</figcaption><a href="05_night_pair/whole_after.png"><img src="05_night_pair/whole_after.png" alt="夜景全景调整后"></a></figure></div></section><p>深水及倒影仍有柔化感，倒影边缘锯齿仍可见。</p><p><a href="README.md">采集与修改记录</a></p></main></html>
