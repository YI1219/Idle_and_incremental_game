<main><h1>方案 A 净化岩壁、硬朗折角与台缘反向露岩过渡</h1><p>两侧均为实际 Godot Forward+ 输出，同机位、同光照、原生 2560×1440。对齐用户选定的方案 A：保留约七成利落大面与一主一辅硬切斜肩巨石，消除瀑布侧竖柱怪异鼓肚/收腰 S 折弯，移除自动散落台缘碎石，新增外缘石壁反向咬入稀疏草坪的露岩过渡，受保护光照/石材着色器全程零改动。</p>
