<main><h1>保留长斜面与岩层错落</h1>
<p>撤掉整块压短的处理。保留原来岩层的高低、前后叠压与舒展斜面，仅重塑最下端，让收脚接入后方主岩体。材质、原有取色、灯光与庭院布局保持。</p>
<label>比较版本 <select id="baseline"><option value="../20261113_cliff_foot/final">上一轮压短版（已被否定）</option><option value="../20261113_cliff_foot/before">本任务最初原始版</option></select></label>
<label>机位 <select id="view"><option value="whole">正面全景</option><option value="foot_front">正面岩壁近景</option><option value="reverse">背面全景</option><option value="foot_reverse">背面低角度</option><option value="side_106">侧面 106°</option><option value="side_286">侧面 286°</option><option value="cliff_close">岩壁特写</option><option value="game">游戏距离</option><option value="close">庭院近景</option></select></label>
<div class="pair"><figure><figcaption id="baseLabel">上一轮压短版（已被否定）</figcaption><a id="oldLink" href="../20261113_cliff_foot/final/whole.png"><img id="old" src="../20261113_cliff_foot/final/whole.png" alt="比较基准 Godot 实拍"></a></figure><figure><figcaption>本轮 · 保留层次，只改收脚</figcaption><a id="newLink" href="final/whole.png"><img id="new" src="final/whole.png" alt="本轮 Godot 实拍"></a></figure></div>
<p>以上为同种子 7301、原生 2560×1440、Forward+、4×MSAA、日照 .29、相位 1.25 的实际 Godot 输出；相机、数据和采集条件匹配。点击图片看原图。</p>
<section><h2>多种子与夜景</h2>
<label>布局 <select id="seed"><option value="final">7301 · 默认庭院</option><option value="held2104">2104 · 庭院</option><option value="held4242">4242 · 预设 1</option><option value="held913">913 · 无水预设</option><option value="night">7301 · 夜景</option></select></label>
<label>机位 <select id="heldView"><option value="whole">正面全景</option><option value="reverse">背面全景</option><option value="side_106">侧面 106°</option><option value="side_286">侧面 286°</option><option value="foot_front">正面岩壁近景</option><option value="foot_reverse">背面低角度</option></select></label>

<p>保留种子用于生成检查，默认日景提供严格前后对照。整体美术效果以实拍审阅为准，原主岩体的局部薄尖和接缝尚未整体重做。</p>

const view=document.getElementById('view'),baseline=document.getElementById('baseline'),seed=document.getElementById('seed'),heldView=document.getElementById('heldView');
function setImage(id,path){document.getElementById(id).src=path;document.getElementById(id+'Link').href=path}
function pair(){setImage('old',baseline.value+'/'+view.value+'.png');setImage('new','final/'+view.value+'.png');document.getElementById('baseLabel').textContent=baseline.value.endsWith('/before')?'本任务最初原始版':'上一轮压短版（已被否定）'}
