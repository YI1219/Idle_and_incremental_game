<main><h1>外层岩壁底缘收束</h1><p><strong>本压短方案已被用户否定。<a href="../20261113_cliff_join/compare.html">查看保留岩层错落的当前版本</a></strong></p>
<p>缩短向下挂出的外层岩块，让它结束在主岩体与对应地形底缘之上。上部岩肩保留，主岩体、顶冠、材质、原有岩石取色和光照参数保持。以下均为实际 Godot 输出。</p>

</select></label>

<p>默认种子 7301；原生 2560×1440，Forward+、4×MSAA、日照 .29、相位 1.25；相机、权威地形与采集条件匹配。点击图片可查看原图。</p>
