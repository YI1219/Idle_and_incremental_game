<!doctype html><meta charset="utf-8"><title>云海远景分层 · Godot 实拍</title><style>body{margin:24px;background:#161c20;color:#e4ebe7;font:16px system-ui}p{max-width:1000px;line-height:1.6}select,button{font:inherit;padding:8px}main{display:grid;grid-template-columns:1fr 1fr;gap:12px}img{width:100%;height:auto}a{color:#a5d6c6}small{color:#bac7c5}</style><h1>云海远景分层 · 实际 Godot 对照</h1><p>同场景、地形、水、相机、相位与光照。左侧为本轮起点，右侧为最终实现。2560×1440 原生输出，前景仍原分辨率，只有远云/远山/背景天空以半宽半高 HDR 渲染。主天空环境光数学保留，最终后处理只做一次。远景深度合并到天空，可能轻微改变远山景深和细边缘；不是逐像素无损或用户美术验收。</p><p><select id="view"><option value="2104_close">2104_close</option><option value="2104_reverse">2104_reverse</option><option value="2104_whole">2104_whole</option><option value="4242_close">4242_close</option><option value="4242_reverse">4242_reverse</option><option value="4242_whole">4242_whole</option><option value="7301_close">7301_close</option><option value="7301_dusk">7301_dusk</option><option value="7301_high">7301_high</option><option value="7301_low">7301_low</option><option value="7301_night">7301_night</option><option value="7301_reverse">7301_reverse</option><option value="7301_whole">7301_whole</option><option value="913_close">913_close</option><option value="913_reverse">913_reverse</option><option value="913_whole">913_whole</option></select> <a href="README.md">实测与边界</a> · <a href="pairs/captures.json">采图记录</a> · <a href="pairs/pixel_comparison.json">差异统计</a></p><main><div><p>优化前</p><a id="oldlink"><img id="old"></a></div><div><p>优化后</p><a id="newlink"><img id="new"></a></div></main><p><small>点击图片查看原始 2K PNG。原生画质可恢复原远景；1080p 内部渲染绕过分层。测试窗口均自动关闭，保留用户原编辑器。</small></p><script>const select=document.querySelector('#view');function update(){const k=select.value;const at=k.indexOf('_');const seed=k.slice(0,at),angle=k.slice(at+1);for(const [id,v] of [['old','before'],['new','after']]){const path=`pairs/${seed}_${v}_${angle}.png`;document.getElementById(id).src=path;document.getElementById(id+'link').href=path;}}select.value='7301_whole';select.onchange=update;update();</script>
